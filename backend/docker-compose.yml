services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wordbattle
      POSTGRES_USER: wordbattle
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wordbattle}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Loopback only. The `api` service reaches Postgres over the compose
      # network and never through this mapping; it is here so psql and a
      # migration test can attach from the same machine. Published as
      # "5432:5432" it would listen on every interface — and on a host with a
      # public address that is the database itself, default password and all,
      # offered to the internet.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordbattle"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/wordbattle
      DB_USER: wordbattle
      DB_PASSWORD: ${DB_PASSWORD:-wordbattle}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET kerak}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-false}
      # Empty by default so the quickstart above works as written. Set it to
      # `prod` in .env for a real deployment — see DatabasePasswordGuard.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  db-data:
