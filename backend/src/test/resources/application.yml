# This file REPLACES src/main/resources/application.yml — it does not merge with
# it. Being first on the test classpath, it is the only application.yml Spring
# finds, so anything the shipped file says and this one does not is simply not
# there: every wordbattle.* value left out below is bound from the @DefaultValue
# annotations in AppProperties instead. The suite therefore plays the game those
# annotations describe, not the one the server ships.
#
# That was not obvious until someone put turn-seconds: 99 in the shipped file and
# the test asserting 15 kept passing. ShippedConfigurationTest now fails the build
# if the annotations and the shipped yml ever say different things, which is what
# makes the arrangement below safe rather than merely quiet.
#
# So keep this file to what a test genuinely has to change — a database that
# exists, a secret the signing code will accept, a login route with no Google
# behind it. Putting a game rule here would hide it from that check.
spring:
  datasource:
    url: jdbc:h2:mem:wordbattle;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    # As the shipped file sets it. Not a game rule, so ShippedConfigurationTest
    # does not police this one — and it was the difference that mattered: on
    # Spring's default of true a session lives for the whole request, so an
    # entity read before an update written in JPQL is handed back stale
    # afterwards. The server does not behave that way and the suite must not
    # either, or the suite is proving the wrong server. Found by a ban that
    # answered with the account as it stood a line before it.
    open-in-view: false
  flyway:
    enabled: false

wordbattle:
  jwt:
    secret: test-secret-that-is-long-enough-for-hs256-signing!!
    ttl: P1D
    issuer: wordbattle-test
  google:
    web-client-id: test-web-client.apps.googleusercontent.com
  dev-login-enabled: true
  time-zone: Asia/Tashkent

logging:
  level:
    root: WARN
    uz.wordbattle: INFO
