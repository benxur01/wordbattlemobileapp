spring:
  application:
    name: wordbattle
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wordbattle}
    username: ${DB_USER:wordbattle}
    password: ${DB_PASSWORD:wordbattle}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

wordbattle:
  jwt:
    # Override in production. HS256 needs at least 32 bytes.
    secret: ${JWT_SECRET:change-me-in-production-please-32-bytes-minimum!!}
    ttl: ${JWT_TTL:P30D}
    issuer: wordbattle
  telegram:
    # Bot token from @BotFather. Empty disables Telegram login (dev login only).
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    # How long a Telegram initData payload stays acceptable.
    max-age: PT24H
  duel:
    turn-seconds: 15
    min-word-length: 3
    # A duel ends in a win once a player has contributed this many words.
    words-to-win: 9
    invite-timeout-seconds: 12
  matchmaking:
    # Rating window starts here and widens every step until max.
    initial-band: 75
    band-step: 25
    max-band: 400
    step-seconds: 3
    # No human opponent within this many seconds -> play a bot.
    bot-fallback-seconds: 12
  dev-login-enabled: ${DEV_LOGIN_ENABLED:false}

logging:
  level:
    uz.wordbattle: INFO
