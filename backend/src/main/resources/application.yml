spring:
  application:
    name: wordbattle
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wordbattle}
    username: ${DB_USER:wordbattle}
    password: ${DB_PASSWORD:wordbattle}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

wordbattle:
  jwt:
    # No default: the server refuses to start without one, because a default
    # secret is a secret everyone with the repository already knows.
    # Generate with: openssl rand -base64 48   (HS256 needs at least 32 bytes)
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:P30D}
    issuer: wordbattle
  cors:
    # Empty by default: a phone app is not a browser and needs no CORS. Set
    # this only when a web build has to reach the API from another origin,
    # e.g. CORS_ALLOWED_ORIGINS=https://play.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # Daily streaks and the practice word roll over at local midnight, not UTC.
  time-zone: ${TIME_ZONE:Asia/Tashkent}
  limits:
    socket-frames-per-second: ${WS_FRAMES_PER_SECOND:20}
    socket-frame-burst: ${WS_FRAME_BURST:40}
  auth:
    # Per address, and only on /api/auth/login and /api/auth/register — the two
    # routes a caller with no account can reach. A player who mistypes their
    # password spends the burst and never notices; a dictionary run gets ten
    # guesses a minute. Raise the burst if players share one address behind a
    # carrier NAT and report being turned away.
    attempts-per-minute: ${AUTH_ATTEMPTS_PER_MINUTE:10}
    attempt-burst: ${AUTH_ATTEMPT_BURST:20}
  admin:
    # The users.id granted the admin role on every start, which is the only way
    # the first admin can exist: the role is a column and the panel grants it,
    # so without this nobody could ever open the panel to grant it to anybody.
    # Empty grants nobody. Leaving it set is harmless — an account that already
    # holds the role is not written to again.
    bootstrap-user-id: ${ADMIN_BOOTSTRAP_USER_ID:}
  google:
    # The *Web* OAuth client id — "web" being Google's name for a client that
    # runs on a server, which is what this is, rather than anything to do with
    # a website. It has to match ApiConfig.googleServerClientId in the app: the
    # app asks Google to address the token to this id and the server accepts no
    # other audience.
    #
    # Defaulted rather than left empty, because empty disables Google login
    # silently and the first sign-in attempt then fails for a reason nothing
    # points at. A client id is not a secret — it ships inside every build.
    # Override for a different Google project; empty still disables login.
    web-client-id: ${GOOGLE_WEB_CLIENT_ID:238943789457-tgpjf2jamd6r8m0ottqn0ik9ce76gpe2.apps.googleusercontent.com}
  duel:
    turn-seconds: 15
    min-word-length: 3
    # A duel ends in a win once a player has contributed this many words.
    words-to-win: 9
    invite-timeout-seconds: 12
    # Letters no chain is left standing on: a word ending in one of these hands
    # over the letter before it instead. Only these two are true dead ends —
    # see DuelSession.requiredLetter() for the counts behind the choice.
    rare-letters: ${DUEL_RARE_LETTERS:x,z}
  matchmaking:
    # These five are one setting, not five: max-band is a fiction unless the
    # widening reaches it before the bot does, and it did not. Two players 325
    # apart (1362 and 1037) queued together and were both handed a bot in the
    # same second — at the twelve seconds the fallback then allowed, the window
    # had opened to 175, and the ceiling of 400 needed thirty-nine. A scripted
    # run stranded a pair 440 apart the same way. Bot duels are unrated, so two
    # players who cannot reach each other cannot close the gap that separates
    # them either: a run of one-sided results parts them for good.
    #
    # Now the window passes 355 at 21s and 475 at 30s — both live gaps — and
    # reaches its ceiling at 33s, two seconds before the bot. A player with
    # nobody to play still gets a game; the search screen counts the wait out
    # loud, so the longer one reads as searching rather than as a hang.
    # MatchmakingBandTest fails if the two schedules drift apart again.
    #
    # Rating window starts here and widens every step until max.
    initial-band: 75
    band-step: 40
    max-band: 500
    step-seconds: 3
    # No human opponent within this many seconds -> play a bot. Never shorter
    # than the time the window needs to reach max-band.
    bot-fallback-seconds: 35
    # How far above the waiting player the fallback bot is rated. It is both
    # what they see and how hard the bot plays, so a 528 meets a 603 and the
    # words it answers with are picked for that number — see
    # DictionaryService.Band. A little above rather than level: the bot is the
    # consolation for finding nobody, and an even one is a dull consolation.
    bot-rating-offset: 75
  rating:
    # Glicko-2 step 6: a player who has not settled a rated duel for this long
    # grows one period's worth of uncertainty back, up to the 180 a new account
    # carries. See AppProperties.Rating for why a day and not the paper's week.
    period-duration: PT24H
  tournament:
    global:
      # Opens Monday morning and kicks off Sunday at 19:00, both in
      # wordbattle.time-zone above: the week to answer an invite, a fixed hour
      # to play. The kickoff is the same every week whether or not the bracket
      # filled early — a bracket full by Tuesday still waits for it — and
      # whatever has accepted by then plays, the bracket shrinking to the
      # largest of 4/8/16/32 that fits.
      cron: "0 0 8 * * MON"
      finalize-cron: "0 0 19 * * SUN"
      size: 32
      # Nobody organizes a Global bracket, so an invite left unanswered this
      # long is taken as a no and the seat is offered to the next player down
      # the ladder. Both brackets are swept on this one value.
      invite-ttl: PT48H
    global-team:
      # The 2v2 bracket, staggered behind the 1v1 one at both ends so the two
      # never open or kick off in the same instant. Size counts teams, not
      # players: 8 teams is 16 people invited.
      cron: "0 0 9 * * MON"
      finalize-cron: "0 30 19 * * SUN"
      size: 8
  dev-login-enabled: ${DEV_LOGIN_ENABLED:false}

logging:
  level:
    uz.wordbattle: INFO
    # Per-frame socket traffic is DEBUG: at INFO a single chatty client fills
    # the log faster than anything useful in it.
    uz.wordbattle.ws.GameSocketHandler: ${WS_LOG_LEVEL:INFO}
